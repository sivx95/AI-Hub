<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta http-equiv="Content-Security-Policy" content="default-src 'self'; style-src 'self' 'unsafe-inline'; script-src 'self' 'unsafe-inline'">
  <title>下载</title>
  <style>
    :root {
      --bg-dark: #17171a;
      --bg-mid: #1e1e22;
      --bg-light: #26262b;
      --bg-hover: #2e2e34;
      --border: #33333a;
      --text-primary: #e4e4e7;
      --text-muted: #5e5e66;
      --text-secondary: #8b8b95;
      --accent: #5b9bff;
      --danger: #ef6a6a;
      --success: #5cc97a;
    }
    * { margin:0; padding:0; box-sizing:border-box; }
    html, body {
      height: 100%;
      overflow: hidden;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "Microsoft YaHei", sans-serif;
      background: var(--bg-dark);
      color: var(--text-primary);
      font-size: 13px;
      user-select: none;
    }
    button { font-family: inherit; cursor: pointer; border: none; background: none; color: inherit; }

    .panel { display: flex; flex-direction: column; height: 100vh; }
    .header {
      display: flex; align-items: center; justify-content: space-between;
      padding: 12px 14px; border-bottom: 1px solid var(--border); flex-shrink: 0;
    }
    .title { font-size: 14px; font-weight: 600; }
    .actions { display: flex; gap: 4px; }
    .icon-btn {
      width: 26px; height: 26px;
      display: flex; align-items: center; justify-content: center;
      border-radius: 6px; color: var(--text-muted);
      transition: all 0.15s ease;
    }
    .icon-btn:hover { background: var(--bg-mid); color: var(--text-primary); }
    .icon-btn svg { width: 13px; height: 13px; }
    .dir {
      padding: 8px 14px; font-size: 11px; color: var(--text-muted);
      background: var(--bg-mid); border-bottom: 1px solid var(--border);
      flex-shrink: 0; white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
    }
    .list { flex: 1; overflow-y: auto; padding: 4px; }
    .list::-webkit-scrollbar { width: 6px; }
    .list::-webkit-scrollbar-thumb { background: var(--border); border-radius: 3px; }

    .dl-item {
      display: flex; align-items: center; padding: 10px 12px; gap: 10px;
      border-radius: 6px; transition: background 0.12s;
    }
    .dl-item:hover { background: var(--bg-mid); }
    .dl-icon {
      width: 28px; height: 28px; border-radius: 6px; background: var(--bg-light);
      display: flex; align-items: center; justify-content: center; flex-shrink: 0; color: var(--accent);
    }
    .dl-icon svg { width: 14px; height: 14px; }
    .dl-info { flex: 1; min-width: 0; padding-right: 8px; }
    .dl-name {
      font-size: 12px; color: var(--text-primary);
      white-space: nowrap; overflow: hidden; text-overflow: ellipsis; margin-bottom: 4px;
    }
    .dl-progress {
      height: 3px; background: var(--bg-hover); border-radius: 2px;
      overflow: hidden; margin-bottom: 4px;
    }
    .dl-progress-bar { height: 100%; background: var(--accent); border-radius: 2px; transition: width 0.2s ease; }
    .dl-progress-bar.complete { background: var(--success); }
    .dl-progress-bar.paused { background: var(--text-secondary); }
    .dl-meta { display: flex; gap: 8px; font-size: 11px; color: var(--text-muted); }
    .dl-meta .state { color: var(--accent); }
    .dl-meta .state.complete { color: var(--success); }
    .dl-meta .state.error { color: var(--danger); }
    .dl-meta .state.paused { color: var(--text-secondary); }
    .dl-actions { display: flex; gap: 2px; flex-shrink: 0; align-items: center; }
    .dl-btn {
      width: 24px; height: 24px;
      display: flex; align-items: center; justify-content: center;
      border-radius: 4px; color: var(--text-muted); transition: all 0.12s;
    }
    .dl-btn:hover { background: var(--bg-hover); color: var(--text-primary); }
    .dl-btn.danger:hover { color: var(--danger); }
    .dl-btn svg { width: 12px; height: 12px; }
    .empty {
      text-align: center; padding: 40px 20px;
      color: var(--text-muted); font-size: 12px; line-height: 1.8;
    }
  </style>
</head>
<body>
  <div class="panel">
    <div class="header">
      <div class="title">下载</div>
      <div class="actions">
        <button class="icon-btn" id="dirBtn" title="设置下载目录">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
            <path d="M22 19a2 2 0 0 1-2 2H4a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h5l2 3h9a2 2 0 0 1 2 2z"/>
          </svg>
        </button>
        <button class="icon-btn" id="clearBtn" title="清空下载列表">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
            <path d="M3 6h18M8 6V4a2 2 0 0 1 2-2h4a2 2 0 0 1 2 2v2m3 0v14a2 2 0 0 1-2 2H7a2 2 0 0 1-2-2V6"/>
          </svg>
        </button>
      </div>
    </div>
    <div class="dir" id="dir">下载目录</div>
    <div class="list" id="list"></div>
  </div>
  <script>
    const list = document.getElementById('list');
    const dirEl = document.getElementById('dir');
    let downloads = [];

    function formatBytes(b) {
      if (b < 1024) return b + ' B';
      if (b < 1048576) return (b / 1024).toFixed(1) + ' KB';
      if (b < 1073741824) return (b / 1048576).toFixed(1) + ' MB';
      return (b / 1073741824).toFixed(2) + ' GB';
    }
    function escapeHtml(s) {
      const d = document.createElement('div');
      d.textContent = s;
      return d.innerHTML;
    }

    function render() {
      list.innerHTML = '';
      if (downloads.length === 0) {
        list.innerHTML = '<div class="empty">还没有下载记录<br>在 AI 网页中点击下载文件即可</div>';
        return;
      }
      downloads.forEach(dl => {
        const percent = dl.totalBytes > 0 ? Math.round((dl.receivedBytes / dl.totalBytes) * 100) : 0;
        const isComplete = dl.state === 'completed';
        const isError = dl.state === 'interrupted' || dl.state === 'cancelled';
        const isProgressing = dl.state === 'progressing';
        const isPaused = isProgressing && dl.paused;
        const stateText = isComplete ? '已完成' : (isError ? '失败' : isPaused ? '已暂停' : percent + '%');
        const stateClass = isComplete ? 'complete' : isError ? 'error' : isPaused ? 'paused' : '';
        const iconSvg = isComplete
          ? '<polyline points="20 6 9 17 4 12"/>'
          : isError
            ? '<line x1="18" y1="6" x2="6" y2="18"/><line x1="6" y1="6" x2="18" y2="18"/>'
            : '<path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"/><polyline points="7 10 12 15 17 10"/><line x1="12" y1="15" x2="12" y2="3"/>';

        // 下载中：显示暂停/恢复 + 取消按钮
        let ctrlBtns = '';
        if (isProgressing) {
          ctrlBtns = isPaused
            ? '<button class="dl-btn resume" title="恢复下载"><svg viewBox="0 0 24 24" fill="currentColor" stroke="none"><polygon points="6 4 20 12 6 20 6 4"/></svg></button>'
            : '<button class="dl-btn pause" title="暂停下载"><svg viewBox="0 0 24 24" fill="currentColor" stroke="none"><rect x="6" y="4" width="4" height="16" rx="1"/><rect x="14" y="4" width="4" height="16" rx="1"/></svg></button>';
          ctrlBtns += '<button class="dl-btn cancel danger" title="取消下载"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><line x1="18" y1="6" x2="6" y2="18"/><line x1="6" y1="6" x2="18" y2="18"/></svg></button>';
        }

        const item = document.createElement('div');
        item.className = 'dl-item';
        item.innerHTML =
          '<div class="dl-icon"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">' + iconSvg + '</svg></div>' +
          '<div class="dl-info">' +
            '<div class="dl-name" title="' + escapeHtml(dl.filename) + '">' + escapeHtml(dl.filename) + '</div>' +
            (isComplete ? '' : '<div class="dl-progress"><div class="dl-progress-bar' + (isPaused ? ' paused' : '') + '" style="width:' + percent + '%"></div></div>') +
            '<div class="dl-meta">' +
              '<span class="state ' + stateClass + '">' + stateText + '</span>' +
              '<span>' + formatBytes(dl.receivedBytes) + ' / ' + (dl.totalBytes > 0 ? formatBytes(dl.totalBytes) : '未知大小') + '</span>' +
            '</div>' +
          '</div>' +
          '<div class="dl-actions">' +
            ctrlBtns +
            (isComplete && dl.savePath ? '<button class="dl-btn open-loc" title="打开文件位置"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M22 19a2 2 0 0 1-2 2H4a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h5l2 3h9a2 2 0 0 1 2 2z"/></svg></button>' : '') +
          '</div>';

        const openBtn = item.querySelector('.open-loc');
        if (openBtn) openBtn.addEventListener('click', () => window.api.openFileLocation(dl.savePath));
        const pauseBtn = item.querySelector('.pause');
        if (pauseBtn) pauseBtn.addEventListener('click', () => window.api.pauseDownload(dl.id));
        const resumeBtn = item.querySelector('.resume');
        if (resumeBtn) resumeBtn.addEventListener('click', () => window.api.resumeDownload(dl.id));
        const cancelBtn = item.querySelector('.cancel');
        if (cancelBtn) cancelBtn.addEventListener('click', () => window.api.cancelDownload(dl.id));
        list.appendChild(item);
      });
    }

    // 注意：done 事件的 state 在 Electron 中是 'completed' / 'cancelled' / 'interrupted'
    window.api.getDownloads().then(d => { downloads = d; render(); });
    window.api.onDownloadsUpdated(d => { downloads = d; render(); });
    window.api.onDownloadDirUpdated(d => { dirEl.textContent = '下载目录：' + d; });
    window.api.getDownloadDir().then(d => { dirEl.textContent = '下载目录：' + d; });

    document.getElementById('dirBtn').addEventListener('click', () => window.api.setDownloadDir());
    document.getElementById('clearBtn').addEventListener('click', () => {
      if (downloads.length > 0) window.api.clearDownloads();
    });
  </script>
</body>
</html>
